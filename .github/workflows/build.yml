name: Build mod

on:
  push:
    branches: [main, maidens]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Publish the build log if it failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete maidens-build-log --yes --cleanup-tag || true
          gh release create maidens-build-log build.log --prerelease --target "$GITHUB_SHA" --title "Maidens: failed build log" --notes "Output of the last failed build."

      - name: Keep the jar with this run
        uses: actions/upload-artifact@v4
        with:
          name: maidens-jar
          path: build/libs/*.jar

      - name: Publish as the "latest" release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/maidens')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$([ "$GITHUB_REF_NAME" = maidens ] && echo maidens-latest || echo latest)
          gh release delete $tag --yes --cleanup-tag || true
          gh release create $tag build/libs/*.jar --target "$GITHUB_SHA" \
            --title "Maidens (latest build)" \
            --notes "Drop the .jar into your mods folder. Needs NeoForge 1.21.1, nothing else."

      - name: Game test (a fresh world, the house, and everything she does)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/maidens')
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          rm -rf run-selftest && mkdir -p run-selftest
          echo "eula=true" > run-selftest/eula.txt
          if [[ "$COMMIT_MSG" == *"[villages]"* ]]; then touch run-selftest/run-selftest-villages-only; fi
          printf "level-seed=20261108\nonline-mode=false\nlevel-name=world\nmax-tick-time=-1\nspawn-protection=0\n" > run-selftest/server.properties
          timeout 1500 ./gradlew runSelftest --stacktrace > selftest.log 2>&1 || true
          mkdir -p run-selftest/selftest
          cp selftest.log run-selftest/selftest/
          grep -iE "error|exception|failed|maidens" run-selftest/logs/latest.log | head -300 > run-selftest/selftest/problems.txt || true
          cat run-selftest/selftest/report.txt || true

      - name: Publish the game test results
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/maidens')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd run-selftest/selftest && zip -qr ../../selftest.zip . && cd ../..
          gh release delete maidens-tests --yes --cleanup-tag || true
          gh release create maidens-tests selftest.zip --prerelease --target "$GITHUB_SHA" --title "Maidens test results" --notes "Game test report and logs, and the client test screenshots when that runs."

      - name: Client test (screenshots)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/maidens') && contains(github.event.head_commit.message, '[client]')
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -yq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils >/dev/null
          D=run-clienttest; rm -rf $D; mkdir -p $D/saves clientshots
          cp -r run-selftest/world $D/saves/test
          cp run-selftest/selftest/house.txt $D/ 2>/dev/null || true
          cp run-selftest/selftest/village.txt $D/ 2>/dev/null || true
          cp run-selftest/selftest/castle.txt $D/ 2>/dev/null || true
          printf 'onboardAccessibility:false\ntutorialStep:none\npauseOnLostFocus:false\nrenderDistance:10\nsimulationDistance:5\nfov:0.0\nguiScale:2\nsoundCategory_master:0.0\njoinedFirstServer:true\nskipMultiplayerWarning:true\n' > $D/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClienttest --stacktrace > clienttest.log 2>&1 || true
          cp $D/screenshots/*.png clientshots/ 2>/dev/null || true
          cp clienttest.log clientshots/ ; cp $D/logs/latest.log clientshots/ 2>/dev/null || true

      - name: Publish the client test
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/maidens') && contains(github.event.head_commit.message, '[client]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd clientshots && zip -qr ../clienttest.zip . && cd ..
          gh release upload maidens-tests clienttest.zip --clobber
