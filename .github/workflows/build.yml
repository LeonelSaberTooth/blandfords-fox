name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Keep the jar with this run
        uses: actions/upload-artifact@v4
        with:
          name: blandfords-fox-jar
          path: build/libs/*.jar

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar \
            --title "Blandford's Fox (latest build)" \
            --notes "Drop the .jar into your mods folder. Needs NeoForge 1.21.1 and GeckoLib 4.9 or newer for NeoForge 1.21.1."
