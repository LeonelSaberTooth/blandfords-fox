name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Publish a few vanilla sources for reference
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find build/moddev ~/.gradle -name "*sources*.jar" 2>/dev/null | head -20
          jar=""
          for j in $(find build/moddev ~/.gradle -name "*sources*.jar" 2>/dev/null); do
            if unzip -l "$j" 'net/minecraft/client/model/HorseModel.java' >/dev/null 2>&1; then jar="$j"; break; fi
          done
          echo "sources: $jar"
          [ -n "$jar" ] || exit 0
          mkdir -p mcsrc && cd mcsrc
          unzip -q -o "$jar" \
            'net/minecraft/client/model/HorseModel.java' 'net/minecraft/client/model/ChestedHorseModel.java' \
            'net/minecraft/client/renderer/entity/ChestedHorseRenderer.java' 'net/minecraft/client/renderer/entity/AbstractHorseRenderer.java' \
            'net/minecraft/client/model/geom/ModelPart.java' 'net/minecraft/world/entity/animal/Rabbit.java' \
            'net/minecraft/world/entity/ai/control/JumpControl.java' 'net/minecraft/world/entity/animal/horse/Donkey.java' \
            'net/minecraft/world/entity/animal/horse/AbstractChestedHorse.java' 'net/minecraft/client/model/RabbitModel.java' || true
          find . -name "*.java" | sed 's|^\./||' > index.txt
          zip -qr ../mcsrc.zip .
          cd ..
          gh release delete mcsrc --yes --cleanup-tag || true
          gh release create mcsrc mcsrc.zip --prerelease --title "Vanilla sources (reference)" --notes "A few decompiled classes used while writing the mod."

      - name: Publish the build log if it failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log build.log --prerelease --title "Failed build log" --notes "Output of the last failed build."


      - name: Keep the jar with this run
        uses: actions/upload-artifact@v4
        with:
          name: blandfords-fox-jar
          path: build/libs/*.jar

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar \
            --title "Middle East (latest build)" \
            --notes "Drop the .jar into your mods folder. Needs NeoForge 1.21.1 and GeckoLib 4.9 or newer for NeoForge 1.21.1."

      - name: World generation test
        if: github.ref == 'refs/heads/main'
        run: |
          run_test() {
            rm -rf run-selftest/world run-selftest/selftest
            mkdir -p run-selftest
            echo "eula=true" > run-selftest/eula.txt
            printf "level-seed=20261030\nonline-mode=false\nlevel-name=world\nmax-tick-time=-1\nlevel-type=$1\n" > run-selftest/server.properties
            timeout 1500 ./gradlew runSelftest --stacktrace > selftest.log 2>&1 || true
            mkdir -p run-selftest/selftest "results/$2"
            cp selftest.log run-selftest/selftest/
            grep -iE "error|exception|failed" run-selftest/logs/latest.log | head -200 > run-selftest/selftest/problems.txt || true
            cp run-selftest/selftest/* "results/$2/"
          }
          run_test 'minecraft\:normal' .
          run_test 'minecraft\:large_biomes' large
          cd results && zip -qr ../selftest.zip .

      - name: Publish the test results
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete selftest --yes --cleanup-tag || true
          gh release create selftest selftest.zip --prerelease --title "World generation test" --notes "Blocks from a test world, for checking the desert terrain."

      - name: Client test (screenshots with the resource pack)
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[client]')
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -yq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils >/dev/null
          D=run-clienttest; rm -rf $D; mkdir -p $D/mods $D/saves $D/resourcepacks clientshots
          cp -r run-selftest/world $D/saves/test
          for p in entity-model-features entitytexturefeatures; do
            url=$(curl -s "https://api.modrinth.com/v2/project/$p/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D" | jq -r '[.[] | select(.version_type=="release")][0].files[] | select(.primary) | .url')
            echo "$p: $url" | tee -a clientshots/mods.txt
            curl -sL -o $D/mods/$p.jar "$url"
          done
          cp -r resourcepack/MiddleEast $D/resourcepacks/MiddleEast
          printf 'resourcePacks:["vanilla","mod_resources","file/MiddleEast"]\nonboardAccessibility:false\ntutorialStep:none\npauseOnLostFocus:false\nrenderDistance:8\nsimulationDistance:5\nfov:0.0\nsoundCategory_master:0.0\njoinedFirstServer:true\nskipMultiplayerWarning:true\n' > $D/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClienttest --stacktrace > clienttest.log 2>&1 || true
          cp $D/screenshots/*.png clientshots/ 2>/dev/null || true
          cp clienttest.log clientshots/ ; cp $D/logs/latest.log clientshots/ 2>/dev/null || true
          grep -iE "emf|etf|entity_model|entity_texture|jem|clienttest" $D/logs/latest.log | head -400 > clientshots/emf.txt || true
          cd clientshots && zip -qr ../clienttest.zip .

      - name: Publish the client test
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[client]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete clienttest --yes --cleanup-tag || true
          gh release create clienttest clienttest.zip --prerelease --title "Client test" --notes "Screenshots from a real client with the resource pack."
