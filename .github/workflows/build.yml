name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Keep the jar with this run
        uses: actions/upload-artifact@v4
        with:
          name: blandfords-fox-jar
          path: build/libs/*.jar

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar \
            --title "Blandford's Fox (latest build)" \
            --notes "Drop the .jar into your mods folder. Needs NeoForge 1.21.1 and GeckoLib 4.9 or newer for NeoForge 1.21.1."

      - name: World generation test
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p run-selftest
          echo "eula=true" > run-selftest/eula.txt
          printf "level-seed=20261030\nonline-mode=false\nlevel-name=world\nmax-tick-time=-1\n" > run-selftest/server.properties
          timeout 1500 ./gradlew runSelftest --stacktrace > selftest.log 2>&1 || true
          mkdir -p run-selftest/selftest
          cp selftest.log run-selftest/selftest/
          grep -iE "error|exception|failed" run-selftest/logs/latest.log | head -200 > run-selftest/selftest/problems.txt || true
          cd run-selftest/selftest && zip -q ../../selftest.zip *

      - name: Publish the test results
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete selftest --yes --cleanup-tag || true
          gh release create selftest selftest.zip --prerelease --title "World generation test" --notes "Blocks from a test world, for checking the desert terrain."
