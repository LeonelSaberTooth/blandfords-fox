[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Maidens live in little houses out in the plains and forests. Trade with them like farmer villagers,
chat, joke, compliment, flirt and give gifts until they like you, hire them to farm, guard, cut wood,
mine or fish, and propose with the gift each one dreams of.
'''

