modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Adds the Blandford's fox: a small desert fox that behaves exactly like a vanilla fox.
It sleeps through the day, pounces on chickens and rabbits, eats sweet berries,
carries items in its mouth and can be bred into trusting cubs.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="${geckolib_version_range}"
    ordering="AFTER"
    side="BOTH"
