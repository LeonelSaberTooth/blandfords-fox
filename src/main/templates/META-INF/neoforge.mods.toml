modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Middle Eastern wildlife and landscapes: Negev-style deserts with highland plateaus,
layered limestone valleys and dry riverbeds, and the animals that live there:
the Blandford's fox, the caracal and the hyena.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="${geckolib_version_range}"
    ordering="AFTER"
    side="BOTH"

# Optional compatibility with Far East (its snowy taiga: birch instead of oak, no lichen)
[[dependencies.${mod_id}]]
    modId="fareast"
    type="optional"
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
config="blandfordsfox.mixins.json"
